<title>辺境星系戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 作戦卓（星図＋右の指令パネル）と、全画面に重なる戦術戦闘画面の二層 */
:root{
  --void:#080b16; --deck:#10152a; --deck2:#171e3a; --line:#2b3566; --ink:#e4e7f4; --dim:#8c94bd;
  --ally:#f2b84b; --ally-soft:#f2b84b33; --foe:#ea5a4f; --foe-soft:#ea5a4f30; --xeno:#b974ff; --xeno-soft:#b974ff30;
  --neutral:#6f7aa8; --move:#3aa0ff40; --move-line:#3aa0ff; --good:#5fd38d;
  --f-display:"DotGothic16","Hiragino Kaku Gothic ProN","Meiryo",monospace;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:var(--ink);background:var(--deck2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--ally);color:var(--ally)}
button:focus-visible{outline:2px solid var(--ally);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--ally);color:#1a1405;border-color:var(--ally);font-weight:700}
button.primary:hover:not(:disabled){filter:brightness(1.1);color:#1a1405}
button.danger{border-color:var(--foe);color:var(--foe)}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;border-bottom:1px solid var(--line);padding-bottom:8px}
header.bar h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.08em;color:var(--ally)}
.stat{font-family:var(--f-display);font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:400;margin-left:4px}
.bar .spacer{flex:1}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.mapwrap{background:var(--void) url(art/bg_map.webp) center/cover no-repeat;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
#map{display:block;width:100%;height:auto}
aside.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--deck);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0;letter-spacing:.06em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:14px;margin:0;color:var(--dim);letter-spacing:.05em}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid currentColor;letter-spacing:.06em}
.own-P{color:var(--ally)}.own-E{color:var(--foe)}.own-M,.own-H{color:var(--xeno)}.own-N{color:var(--neutral)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.progress{height:8px;background:var(--deck2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--ally)}
.fleet{border:1px solid var(--line);border-radius:5px;padding:8px;display:flex;flex-direction:column;gap:6px}
.fleet.sel{border-color:var(--ally);box-shadow:0 0 0 1px var(--ally) inset}
.fleet .title{display:flex;justify-content:space-between;gap:6px;align-items:center;font-family:var(--f-display)}
.ships{display:flex;flex-direction:column;gap:3px}
.shipline{display:grid;grid-template-columns:16px 1fr 70px;gap:6px;align-items:center;font-size:12px}
.hpbar{height:6px;background:var(--deck2);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good)}
.hint{color:var(--dim);font-size:12px}
.log{background:var(--deck);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12.5px;max-height:132px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.log p{margin:0}.log p:first-child{color:var(--ink)}.log p{color:var(--dim)}
.overlay{position:fixed;inset:0;background:#04060ecc;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.card{background:var(--deck);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:20px;color:var(--ally);letter-spacing:.06em;text-wrap:balance}
.card p{margin:0}
.speaker{font-family:var(--f-display);color:var(--ally);font-size:13px;letter-spacing:.1em}
.comm{border-left:3px solid var(--ally);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.comm.has-face{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 12px;align-items:start}
.comm .face{width:72px;height:72px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--deck2)}
.comm-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.keyart{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--void)}
.pthumb{width:30px;height:30px;object-fit:contain;flex:none}
@media (max-width:700px){.comm.has-face{grid-template-columns:56px minmax(0,1fr)}.comm .face{width:56px;height:56px}}
.comm.foe{border-color:var(--foe)}.comm.foe .speaker{color:var(--foe)}
.comm.xeno{border-color:var(--xeno)}.comm.xeno .speaker{color:var(--xeno)}
.refit-ship{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.refit-ship svg{width:96px;height:64px;background:var(--void);border-radius:4px}
.alloc{display:grid;grid-template-columns:64px 26px 1fr 26px 22px;gap:4px 6px;align-items:center;font-size:12.5px}
.alloc button{padding:0;height:24px;width:26px}
.pips{display:flex;gap:2px}.pips i{flex:1;height:10px;background:var(--deck2);border:1px solid var(--line);border-radius:1px}
.pips i.on{background:var(--ally);border-color:var(--ally)}
.form-opt{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px}
.form-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(5,11px);grid-template-rows:repeat(7,11px);gap:1px;flex:none}
.form-grid i{font-style:normal;font-size:9px;line-height:11px;text-align:center;background:rgba(127,140,200,.12);color:var(--ally)}
.form-grid i.flag{color:var(--ally);font-weight:bold}
.form-opt.primary .form-grid i{background:rgba(0,0,0,.18);color:#1a1405}
.form-opt.primary .hint{color:#1a1405;opacity:.85}
.derived{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cls{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.cls svg{width:100%;height:56px;background:var(--void);border-radius:4px}
.cls.locked{opacity:.4}
/* battle */
.battle{position:fixed;inset:0;background:var(--void);z-index:15;overflow:auto;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.battle-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.bhead h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:20px;letter-spacing:.06em}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;align-items:start}
@media (max-width:860px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.bfield{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a0f20 url(art/bg_battle.webp) center/cover no-repeat}
#bsvg{display:block;width:100%;height:auto;touch-action:manipulation}
.phase{font-family:var(--f-display);font-size:15px}
.phase.P{color:var(--ally)}.phase.E{color:var(--foe)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.flash{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.2}to{opacity:1}}

/* 戦闘の操作バー（全サイズ共通、画面下に追従） */
.bgrid>.bfield{grid-column:1}
.bgrid>#bSide{grid-column:2;grid-row:1 / span 2}
@media (max-width:860px){.bgrid>#bSide{grid-column:1;grid-row:auto}}
.bbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--deck);border:1px solid var(--line);border-radius:6px;padding:8px 10px;z-index:2;grid-column:1}
.bbar .bb-info{flex:1 1 140px;min-width:0;font-family:var(--f-display);font-size:14px}
.mbar{display:none}
@media (pointer:coarse){button{min-height:44px;padding:8px 14px}.alloc{grid-template-columns:56px 44px 1fr 44px 20px}.alloc button{height:44px;width:44px}}
/* 指令パネルの並び（既定）：駐留艦隊を先頭に。PCの固定レイアウトでは下の @media で並べ直す */
.side .p-fleet{order:1}.side .p-planet{order:2}.side .p-all{order:3}.side .p-research{order:4}
/* スマホ・タブレット：ターン終了などを画面下の操作バーに */
@media (max-width:900px){
  #btnEnd{display:none}
  .app{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;gap:8px;align-items:center;background:var(--deck);border-top:1px solid var(--line);
    padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .mb-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .mb-fleet{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .cancel{border-color:var(--move-line);color:#9fd4ff}
  #mbEnd{margin-left:12px}
}
@media (max-width:700px){
  body{padding-block:8px 0}
  header.bar{gap:4px 12px}
  header.bar h1{font-size:20px;flex-basis:100%}
  .stat{font-size:13px}
  .battle{padding-left:8px;padding-right:8px}
  .bhead{flex-wrap:nowrap;flex-direction:column;gap:2px}
  .bhead h2{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bhead .hint{display:block;font-size:11.5px}
  .bbar{bottom:env(safe-area-inset-bottom,0px)}
  .bbar button{flex:1;white-space:nowrap;padding-inline:6px}
  .bbar .bb-info{flex-basis:100%}
  #bsvg{max-height:calc(100dvh - 230px)}
}
/* 演出・敵の行動中は、押せないことが見た目でも分かるように */
body.anim .side,body.anim .sideL,body.anim .mbar button{opacity:.55;filter:saturate(.5)}
#battle:not([hidden]) ~ #ffwd{display:none!important}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.slot.empty{border-style:dashed}
.slot.good{border-color:var(--ally)}
.slot-mark{font-family:var(--f-display);width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;color:var(--ally)}
.slot.empty .slot-mark{color:var(--dim)}
.slot-body{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.cls.next svg image{filter:brightness(0) drop-shadow(0 0 3px #3aa0ff) drop-shadow(0 0 1px #9fd4ff)}
.cls.next{border-style:dashed;border-color:#3aa0ff88}
/* 演出中は操作を受け付けない（クリックで早送り） */
body.anim .app,body.anim .mbar{pointer-events:none}
/* フェイズ・ターンの帯 */
.banner{position:fixed;left:0;right:0;top:36%;z-index:30;pointer-events:none;display:flex;justify-content:center;--bn-col:var(--ally);--bn-bg:#1a1405e6}
.banner.E{--bn-col:var(--foe);--bn-bg:#2a0b0ae6}.banner.M{--bn-col:var(--xeno);--bn-bg:#1d0b30e6}.banner.W{--bn-col:#e4e7f4;--bn-bg:#10152ae6}
.bn-in{width:100%;padding:12px 16px 14px;text-align:center;background:linear-gradient(90deg,transparent,var(--bn-bg) 15%,var(--bn-bg) 85%,transparent);border-block:2px solid var(--bn-col);display:flex;flex-direction:column;gap:2px;animation:bnIn var(--bn-ms,1100ms) ease-in-out both}
.bn-in b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5.4vw,46px);line-height:1.2;letter-spacing:.22em;color:var(--bn-col);text-shadow:0 0 14px var(--bn-col)}
.bn-in span{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;color:var(--ink)}
@keyframes bnIn{0%{transform:translateX(-30%) scaleY(.1);opacity:0}14%{transform:none;opacity:1}84%{transform:none;opacity:1}100%{transform:translateX(30%) scaleY(.1);opacity:0}}
.ffwd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:31;pointer-events:none;font-family:var(--f-display);font-size:12px;color:var(--dim);background:#080b16cc;border:1px solid var(--line);border-radius:4px;padding:3px 8px}
@media (max-width:700px){.ffwd{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* 戦闘演出 */
@keyframes hitShake{0%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}100%{transform:none}}
@keyframes hitFlash{0%{filter:brightness(3.2) saturate(0)}35%{filter:brightness(1.8) sepia(1) hue-rotate(-30deg) saturate(4)}100%{filter:none}}
.u-hit{animation:hitShake .34s linear,hitFlash .34s ease-out}
@keyframes actorPulse{from{opacity:1;stroke-width:3}to{opacity:.35;stroke-width:1.5}}
.actor-ring{animation:actorPulse .45s ease-in-out infinite alternate}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid;vertical-align:-1px;margin-right:4px}
button.on{border-color:var(--foe);color:var(--foe);background:#2a0b0a}
button.auto-on{border-color:var(--good);color:var(--good);background:#0c2a18}
.layout>.mapcol{display:flex;flex-direction:column;gap:10px;min-width:0}
aside.sideL{display:none}
.kbd{display:none;font-family:var(--f-display);font-size:10.5px;line-height:1;padding:2px 4px;margin-left:6px;border:1px solid currentColor;border-radius:3px;opacity:.6;vertical-align:1px}
.maphint{display:none}
/* マウス用のツールチップ */
.tip{position:fixed;z-index:40;pointer-events:none;max-width:300px;background:#0b1024f2;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 24px #0008;display:flex;flex-direction:column;gap:3px}
.tip b{font-family:var(--f-display);font-weight:400;font-size:14px}
.tip .tl{display:flex;justify-content:space-between;gap:10px}
.tip .tl span:first-child{color:var(--dim)}
.tip .act{color:#9fd4ff;font-family:var(--f-display)}
.tip hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
/* PC（広い画面）：画面全体を使い、ページはスクロールさせない。指令パネルだけスクロール */
@media (min-width:1100px) and (min-height:560px){
  body{height:100vh;overflow:hidden;padding-block:10px}
  .app{max-width:none;height:100%}
  .layout{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .layout>.mapcol{min-height:0}
  .mapwrap{flex:1;min-height:0}
  #map{width:100%;height:100%}
  .log{flex:none;height:118px;max-height:none}
  .side{overflow-y:auto;min-height:0;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .side>.panel{flex:none}
  .side .p-fleet{order:1}.side .p-planet{order:2}.side .p-research{order:3}.side .p-all{order:4}
  .kbd{display:inline-block}
  .maphint{display:block;position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000}
  .card.wide{max-width:1060px}
  .card.wide .refit-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 戦闘：盤面を画面の高さに合わせて大きく */
  .battle-in{max-width:1880px}
  .bgrid{grid-template-columns:minmax(0,1fr) 330px;justify-items:center}
  .bgrid>.bfield,.bgrid>.bbar{width:min(100%,calc((100vh - 190px) * 11 / 7));justify-self:center}
  .bgrid>#bSide{justify-self:stretch;max-height:calc(100vh - 110px);overflow-y:auto}
}
@media (min-width:1600px) and (min-height:560px){
  .layout{grid-template-columns:300px minmax(0,1fr) 380px}
  aside.sideL{display:flex}
}
@media (min-width:2200px) and (min-height:560px){.battle-in{max-width:none}.bgrid{grid-template-columns:minmax(0,1fr) 380px}}
@media (pointer:coarse){.kbd,.maphint,.kbd-help{display:none!important}}
</style>

<div class="app">
  <header class="bar">
    <h1>辺境星系戦記</h1>
    <span class="stat">星暦<b id="hTurn"></b></span>
    <span class="stat">資金<b id="hFunds"></b></span>
    <span class="stat">収入<b id="hIncome"></b></span>
    <span class="stat">艦級<b id="hTier"></b></span>
    <span class="spacer"></span>
    <button id="btnSound" aria-pressed="true">音 ON</button>
    <button id="btnHelp">遊び方</button>
    <button id="btnNew">最初から</button>
    <button id="btnEnd" class="primary">ターン終了<span class="kbd">E</span></button>
  </header>
  <div class="layout">
    <aside class="side sideL" id="sideL"></aside>
    <div class="mapcol">
      <section class="mapwrap"><svg id="map" viewBox="0 0 960 540" role="img" aria-label="星図"></svg><div class="maphint" id="mapHint"></div></section>
      <section class="log" id="log" aria-live="polite"></section>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="mbar" id="mbar">
</div>

<div class="battle" id="battle" hidden>
  <div class="battle-in">
    <div class="bhead"><h2 id="bTitle"></h2><span class="phase" id="bPhase"></span><span class="hint" id="bTip"></span></div>
    <div class="bgrid">
      <div class="bfield"><svg id="bsvg" role="img" aria-label="戦術マップ"></svg></div>
      <div class="bbar" id="bBar"></div>
      <div class="panel" id="bSide"></div>
    </div>
  </div>
</div>

<div class="overlay" id="modal" hidden><div class="card" id="modalCard"></div></div>
<div class="banner" id="banner" hidden><div class="bn-in"><b id="bnMain"></b><span id="bnSub"></span></div></div>
<div class="ffwd" id="ffwd" hidden>クリックで早送り</div>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
/* ============ データ ============ */
const CLASSES=[
  {name:"ラーク級",type:"コルベット",hp:12,pts:6,cost:40,research:0,code:"LK-1"},

function bfsPath(from,goalFn,avoid){
  const prev={[from]:-1},q=[from];
  while(q.length){const n=q.shift();if(n!==from&&goalFn(n)){const path=[];let c=n;while(c!==from){path.unshift(c);c=prev[c]}return path}
    for(const m of neighbors(n)){if(m in prev)continue;if(avoid&&avoid(m))continue;prev[m]=n;q.push(m)}}
  return null;
}

async function endTurn(){
  if(S.over||B||ANIM.busy)return;
  // 演出を待つあいだに主星が落ちたり、結果画面から新しいゲームが始まったりしたら、そこで打ち切る
  const G=S,alive=()=>S===G&&!S.over;
  S.mode=null;setBusy(true);
  try{
    render();
    await banner("ターン終了",`星暦${3989+S.turn}年 ── 敵軍の行動`,"W",950);
    if(!alive())return;
    const inc=income();S.funds+=inc;
    let lr=researchOpen()?labRate():0;
    S.fleets.forEach(f=>{if(f.side==="P")f.moved=false});
    S.planets.forEach(p=>{if(p.owner==="P"&&p.def<p.maxDef)p.def=Math.min(p.maxDef,p.def+3)});
    S.turn++;S.enemyTier=Math.min(3,Math.floor((S.turn-1)/6));
    log(`ターン${S.turn}開始。収入 +${inc}${lr?`、研究 +${lr}`:""}。`);
    const queue=[];
    ANIM.enemyTurn=true;setFfwd(true);render();
    // ヴァルガ帝国
    if(!S.truce&&planet(CAPITAL).owner==="E"){
      if(S.turn%3===0&&S.fleets.filter(f=>f.side==="E").length<3){
        const nf=vargaFleet(null,CAPITAL,3+(S.turn>10?1:0));S.fleets.push(nf);
        log(`ヴァルガ帝国が新たな${DOC[nf.doc].name}を本星に配備。`);render();await mapBurst(CAPITAL,"#ea5a4f");if(!alive())return;
      }
    }
    if(!S.truce){
      for(const f of S.fleets.filter(x=>x.side==="E")){
        if(!S.fleets.includes(f))continue;
        const doc=f.doc||"line";
        // 同じ星に自軍艦隊が居座っていれば、まずそれを攻める
        const here=defenders(f.node);
        if(here.length){
          if(doc!=="assault"&&forcePower(here)>fleetPower(f)*1.4&&Math.random()<.7){log(`${f.name}は${planet(f.node).name}で様子をうかがっている。`);continue}
          await mapBurst(f.node,"#ea5a4f");if(!alive())return;queue.push({kind:"fleet",pf:here[0],ef:f,node:f.node,attack:false});continue;
        }
        if(f.node===CAPITAL&&S.fleets.filter(x=>x.side==="E"&&x.node===CAPITAL).length===1&&Math.random()<(doc==="heavy"?.8:.5))continue; // 本星守備
        // 強襲戦隊は1ターンに2星進む（自国領を通り抜けるときだけ）
        for(let step=0;step<(doc==="raid"?2:1);step++){
          const path=vargaPath(f);if(!path)break;const to=path[0];
          const pfs=defenders(to);
          if(pfs.length){
            // 突撃戦隊以外は、明らかに強い相手には仕掛けずに様子を見ることがある（同じ星の自軍艦隊の合計で判断）
            if(doc!=="assault"&&forcePower(pfs)>fleetPower(f)*1.4&&Math.random()<.7){log(`${f.name}は${planet(f.node).name}で様子をうかがっている。`);break}
            await mapBurst(to,"#ea5a4f");if(!alive())return;queue.push({kind:"fleet",pf:pfs[0],ef:f,node:to,attack:false});break;
          }
          await animateFleetMove(f,f.node,to);if(!alive())return;
          const was=planet(to).owner;f.node=to;siege(f,planet(to));render();
          if(was!=="E"){await mapBurst(to,"#ea5a4f");if(!alive())return;break}
        }
      }
    }
    // 異生体
    if(S.monster){
      if(S.respawn>0&&S.fleets.filter(f=>f.side==="M").length<(S.evolved?3:2)&&planet(HIVE).owner==="H"){S.respawn--;spawnXeno();log("深淵の巣から異生体の群れが再び湧き出した。");render();await mapBurst(HIVE,"#b974ff");if(!alive())return}
      for(const f of S.fleets.filter(x=>x.side==="M")){
        if(!S.fleets.includes(f))continue;
        for(let step=0;step<2;step++){
          const path=bfsPath(f.node,n=>n!==HIVE&&planet(n).owner!=="M");if(!path)break;const to=path[0];
          const pfs=defenders(to);
          if(pfs.length){if(!queue.some(q=>q.ef===f)){await mapBurst(to,"#b974ff");if(!alive())return;queue.push({kind:"fleet",pf:pfs[0],ef:f,node:to,attack:false})}break}
          await animateFleetMove(f,f.node,to);if(!alive())return;
          xenoEnter(f,to);
          const p=planet(to);
          if(p.owner!=="M"&&p.owner!=="H"){siege(f,p);render();await mapBurst(to,"#b974ff");if(!alive())return;break}
          render();
        }
      }
    }
    ANIM.enemyTurn=false;ANIM.fast=false;setFfwd(false);
    checkMonsterTrigger();
    render();
    for(const q of queue){
      if(!alive())return;
      if(!S.fleets.includes(q.ef))continue;
      if(q.ef.side==="E"&&S.truce){log(`${q.ef.name.replace("休戦中の","")}は休戦に従い、${planet(q.node).name}への攻撃を取りやめた。`);continue}
      // 迎え撃つのは、その時点で同じ星にいる自軍のいちばん強い艦隊
      const pf=defenders(q.node)[0];if(!pf)continue;q.pf=pf;
      log(`${q.ef.name}が${planet(q.node).name}の${q.pf.name}に襲いかかる！`);
      await startBattle(q);
    }
    if(S!==G)return;
    checkLoss();
    if(!S.over){
      if(!lr&&researchOpen())lr=labRate(); // このターンに異生体が現れて研究が再開した分
      if(lr){S.research+=lr;checkResearch()}
      render();
      await banner(`ターン ${S.turn}`,`星暦${3989+S.turn}年　収入 +${inc}${lr?`・研究 +${lr}`:""}`,"P",1150);
    }
  }finally{ANIM.enemyTurn=false;setFfwd(false);setBusy(false);render()}
}
/* ヴァルガ艦隊の進路：ドクトリンごとに狙いが違う */
function vargaPath(f){
  const avoid=n=>n===HIVE||planet(n).owner==="M"||fleetsAt(n,"M").length>0;
  const doc=f.doc||"line";
  if(doc==="raid"){ // 艦隊のいない、防衛力の低い自国の星を狙う
    const ts=S.planets.filter(p=>p.owner==="P"&&!fleetsAt(p.id,"P").length).sort((a,b)=>a.def-b.def);
    for(const t of ts){const p=bfsPath(f.node,n=>n===t.id,avoid);if(p&&p.length<=4)return p}
  }
  if(doc==="missile"){ // 近くにいる、自分より弱い艦隊を狩る
    const pow=fleetPower(f);
    const p=bfsPath(f.node,n=>fleetsAt(n,"P").some(x=>fleetPower(x)<pow),avoid);if(p&&p.length<=3)return p;
  }
  return bfsPath(f.node,n=>planet(n).owner==="P"||planet(n).owner==="N",avoid);
}
function siege(f,p){
  if(p.owner===f.side)return false;
  const pow=fleetPower(f);
  if(p.owner==="N"&&f.side==="E"){p.owner="E";p.def=Math.max(10,p.def);log(`${p.name}がヴァルガ帝国に併合された。`);return true}

      trail.setAttribute("stroke","#9fd4ff");trail.setAttribute("stroke-dasharray","4 6");trail.setAttribute("x2",bx);trail.setAttribute("y2",by);
      ring.setAttribute("cx",bx);ring.setAttribute("cy",by);
      await tween(320,k=>{mk.setAttribute("transform",`translate(${bx} ${by}) rotate(${ang}) scale(${.1+k*.9})`);ring.setAttribute("r",26-k*22);ring.setAttribute("opacity",k);trail.setAttribute("opacity",.55*(1-k))});
    }else{
      sfx("fleet");
      const dur=f.side==="P"?560:f.side==="M"?420:500;
      await tween(dur,k=>{const e=ease(k),x=ax+(bx-ax)*e,y=ay+(by-ay)*e,lag=Math.max(0,e-.3);
        mk.setAttribute("transform",`translate(${x} ${y}) rotate(${ang})`);
        trail.setAttribute("x1",ax+(bx-ax)*lag);trail.setAttribute("y1",ay+(by-ay)*lag);trail.setAttribute("x2",x);trail.setAttribute("y2",y);trail.setAttribute("opacity",.55*(1-k*.6))});
    }
    g.remove();
  }finally{ANIM.hide.delete(f.id)}
}
/* 星図：攻撃・占領・出現の閃光 */
async function mapBurst(id,col){
  if(window.FAST)return;
  const p=planet(id);if(p.id===HIVE&&!S.monster)return;
  const{x,y}=mpos(p),svg=$("map"),g=svgEl("g",{"pointer-events":"none"});svg.append(g);
  const c1=svgEl("circle",{cx:x,cy:y,r:10,fill:"none",stroke:col,"stroke-width":4}),c2=svgEl("circle",{cx:x,cy:y,r:6,fill:col,opacity:.5});g.append(c2,c1);
  sfx("siege");
  await tween(480,k=>{c1.setAttribute("r",10+k*34);c1.setAttribute("opacity",1-k);c1.setAttribute("stroke-width",4*(1-k)+.5);c2.setAttribute("r",6+k*14);c2.setAttribute("opacity",.5*(1-k))});
  g.remove();
}

/* キーボード操作（PC） */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==="e"&&!$("modal").hidden&&$("endYes")){e.preventDefault();$("endYes").click();return} // 確認ウィンドウでもう一度 E で終了
  if(!$("modal").hidden||!S)return;
  if(B){
    if(B.ended){if(k==="enter"){e.preventDefault();closeBattle()}return}
    if(k==="r"){B.danger=!B.danger;if(!B.busy)renderBattle();return}
    if(k==="a"){toggleAuto();return}
    if(B.phase!=="P"||B.busy)return;
    if(k==="w")battleWaitSel();
    else if(k==="e")battleEndPhase();
    else if(k==="escape"){B.sel=null;B.inspect=null;B.hover=null;renderBattle()}
    else if(/^[1-4]$/.test(k)){const u=B.units.filter(v=>v.side==="P"&&v.hp>0)[Number(k)-1];if(u&&!u.acted){B.sel=u.uid;B.inspect=null;B.hover=null;renderBattle()}}
    return;
  }
  if(S.over||ANIM.busy)return;
  if(k==="e"){e.preventDefault();askEndTurn()}
  else if(k==="f"){const f=S.fleets.find(x=>x.id===S.selFleet&&x.side==="P");if(f){e.preventDefault();openFormation(f)}}
  else if(k==="m"){const f=S.fleets.find(x=>x.id===S.selFleet&&x.side==="P");if(f&&!f.moved){S.sel=f.node;S.mode=S.mode==="move"?null:"move";render()}}
  else if(k==="escape"&&S.mode){S.mode=null;render()}
  else if(/^[1-4]$/.test(k)){const f=S.fleets.filter(x=>x.side==="P")[Number(k)-1];if(f){S.sel=f.node;S.selFleet=f.id;S.mode=null;render()}}
});

let lastNarrow=null;const layoutKey=()=>`${isNarrow()}|${isWide3()}`; // 縦横の切り替えと、左列（技術局・艦隊一覧）の有無
window.addEventListener("resize",()=>{const n=layoutKey();if(n!==lastNarrow){lastNarrow=n;if(S)render();if(B)renderBattle()}});
function start(data){lastNarrow=layoutKey();
  if(data&&data.S&&data.S.planets&&data.S.planets[0].fac){S=data.S;S.mode=null;render();return}
  const sv=loadSave();
  if(sv){S=sv.S;S.mode=null;render();showResume(sv);return}
  newGame();render();
}
/* ============ 自動保存（このブラウザの中だけ） ============
   作戦卓で落ち着いているとき（戦闘・演出・敵の行動中でない）に保存し、次に開いたとき「続きから」を出す。
   AIプレイ（gameAPI）や自動テスト（navigator.webdriver）では保存も読み込みもしない。 */
const SAVE_KEY="fw-save-v1";
let lastSave="",calm=""; // calm: 最後に作戦卓で落ち着いていたときの S（hot snapshot にも使う）
function autosave(){
  if(!S||B||ANIM.busy||window.gameAPI)return;
  calm=S.over?"":JSON.stringify(S);
  if(navigator.webdriver)return;
  try{
    if(S.over){if(lastSave!=="over"){localStorage.removeItem(SAVE_KEY);lastSave="over"}return}
    if(calm!==lastSave){localStorage.setItem(SAVE_KEY,`{"v":1,"at":${Date.now()},"S":${calm}}`);lastSave=calm}
  }catch(e){}
}
function loadSave(){
  if(navigator.webdriver)return null;
  try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(d&&d.v===1&&d.S&&!d.S.over&&Array.isArray(d.S.planets)&&d.S.planets.length===PLANETS.length&&d.S.planets[0].fac&&Array.isArray(d.S.fleets))return d}catch(e){}
  return null;
}
function showResume(sv){
  const mine=S.planets.filter(p=>p.owner==="P").length,when=new Date(sv.at||Date.now());
  openModal(card=>card.append(h("img",{class:"keyart",src:`${ART}key_title.webp`,alt:""}),h("h2",null,"辺境星系戦記"),
    h("p",null,`前回の続きから遊べます。星暦${3989+S.turn}年（ターン${S.turn}）・資金 ${S.funds}・自国の星 ${mine}・艦級 ${CLASSES[S.tier].name}`),
    h("p",{class:"hint"},`保存：${when.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}　進行はこのブラウザの中に自動で保存されます。`),
    h("div",{class:"row",style:"justify-content:flex-end"},h("button",{onclick:()=>{$("modal").hidden=true;newGame();render()}},"最初から"),h("button",{class:"primary",onclick:closeModal},"続きから"))));
  $("modalCard").querySelector("button.primary").focus({preventScroll:true});
}

window.claude?.hot?.snapshot?.(()=>({S:calm?JSON.parse(calm):null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
